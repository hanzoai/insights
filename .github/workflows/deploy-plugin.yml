name: Deploy Hanzo Insights Plugin Server

on:
  push:
    branches: [master, main]
    paths:
      - 'Dockerfile.node'
      - 'nodejs/**'
      - 'common/scriptvm/typescript/**'
      - 'common/plugin_transpiler/**'
      - 'common/esbuilder/**'
      - 'common/plugin-scaffold/**'
      - 'common/siphash/**'
      - 'common/insights-node/**'
      - '.dockerignore'
      - 'rust/cyclotron-node/**'
      - '.github/workflows/deploy-plugin.yml'
      - 'turbo.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: hanzo-build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_PAT }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/hanzoai/insights-plugin
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.node
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
