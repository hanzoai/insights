# Livestream TUI Build Workflow
#
# This workflow builds the insights-live TUI binaries and publishes them as GitHub releases.
#
# Download the latest version:
#   curl -L https://github.com/hanzoai/insights/releases/download/insights-live-latest/insights-live-linux-amd64 -o insights-live && chmod +x insights-live
#
# Or browse all versions at: https://github.com/hanzoai/insights/releases?q=insights-live&expanded=true

name: Build Livestream TUI

on:
    push:
        branches:
            - main
        paths:
            - 'livestream/tui/**'
            - '.github/workflows/build-livestream-tui.yml'

permissions:
    contents: write

jobs:
    build:
        runs-on: hanzo-build-linux-amd64

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Set up Go
              uses: actions/setup-go@v6
              with:
                  go-version: '1.26'

            - name: Build production binaries
              run: cd livestream && make -f Makefile.tui build-all

            - name: Create versioned and latest releases
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  VERSION="insights-live-$(date +%Y%m%d-%H%M%S)"

                  # Versioned release for history
                  gh release create "$VERSION" \
                      livestream/insights-live-linux-amd64 \
                      livestream/insights-live-linux-arm64 \
                      livestream/insights-live-darwin-amd64 \
                      livestream/insights-live-darwin-arm64 \
                      --title "Insights Live TUI $VERSION" \
                      --notes "Build from commit ${{ github.sha }}" \
                      --latest=false

                  # Update floating latest release
                  gh release delete insights-live-latest --yes || true
                  git push origin :refs/tags/insights-live-latest || true
                  gh release create insights-live-latest \
                      livestream/insights-live-linux-amd64 \
                      livestream/insights-live-linux-arm64 \
                      livestream/insights-live-darwin-amd64 \
                      livestream/insights-live-darwin-arm64 \
                      --title "Insights Live TUI (Latest)" \
                      --notes "Latest insights-live build - same as $VERSION

                  Download (Linux amd64): \`curl -L https://github.com/hanzoai/insights/releases/download/insights-live-latest/insights-live-linux-amd64 -o insights-live && chmod +x insights-live\`
                  Download (Linux arm64): \`curl -L https://github.com/hanzoai/insights/releases/download/insights-live-latest/insights-live-linux-arm64 -o insights-live && chmod +x insights-live\`
                  Download (macOS amd64): \`curl -L https://github.com/hanzoai/insights/releases/download/insights-live-latest/insights-live-darwin-amd64 -o insights-live && chmod +x insights-live\`
                  Download (macOS arm64): \`curl -L https://github.com/hanzoai/insights/releases/download/insights-live-latest/insights-live-darwin-arm64 -o insights-live && chmod +x insights-live\`" \
                      --latest=false
