name: Datastore HCL Schema Guard

# Deterministic, offline guard for the declarative Datastore HCL schema
# (insights/datastore/hcl/). For each environment it validates that cross-object
# references resolve and that the layered source still reproduces the vendored
# golden cluster dump with zero drift. No live cluster is contacted.

on:
    push:
        branches:
            - master
        paths:
            - 'insights/datastore/hcl/**'
            - '.github/workflows/ci-datastore-hcl-schema.yml'
    pull_request:
        paths:
            - 'insights/datastore/hcl/**'
            - '.github/workflows/ci-datastore-hcl-schema.yml'
    workflow_dispatch:

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
    contents: read
    packages: read

env:
    # The chschema build is pinned in insights/datastore/hcl/bin/image.txt; the repo
    # variable overrides it when set (empty = use the pin).
    HCLEXP_IMAGE: ${{ vars.HCLEXP_IMAGE }}

jobs:
    hcl-guard:
        name: Validate + diff HCL against golden dumps
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        # Informational only while the declarative-HCL pilot stabilizes: the guard
        # runs and reports drift, but a failure must not block PRs. Remove once the
        # managed set is trusted and we want it enforced.
        continue-on-error: true
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - name: Log in to ghcr.io
              uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Install hclexp
              run: bash insights/datastore/hcl/bin/install-hclexp

            - name: HCL schema guard (validate + drift)
              run: bash insights/datastore/hcl/check.sh
