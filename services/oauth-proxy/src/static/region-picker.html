<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, nofollow" />
        <title>Authenticate with Insights</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

        <style>
            :root {
                --brand-ink: #111;
                --text-primary: #111;
                --text-secondary: #5e5e5e;
                --bg: #f3f0ec;
                --bg-card: #fff;
                --border: #e2dfda;
                --radius: 6px;
                --button-border: #b17816;
                --button-border-hover: #8e5b03;
                --button-frame: #eb9d2a;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family:
                    Inter,
                    -apple-system,
                    BlinkMacSystemFont,
                    'Segoe UI',
                    Roboto,
                    'Helvetica Neue',
                    sans-serif;
                background: var(--bg);
                color: var(--text-primary);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                -webkit-font-smoothing: antialiased;
            }

            main {
                max-width: 520px;
                width: 100%;
            }

            main > article {
                border: 1px solid var(--border);
                border-radius: var(--radius);
                overflow: hidden;
                background: var(--bg-card);
                padding: 48px 40px;
                text-align: center;
            }

            header {
                display: inline-flex;
                align-items: center;
                gap: 10px;
                margin-bottom: 28px;
            }

            header svg {
                height: 28px;
                width: auto;
            }

            header .wordmark {
                font-size: 20px;
                font-weight: 600;
                color: var(--text-primary);
            }

            h1 {
                font-size: 22px;
                font-weight: 600;
                line-height: 1.3;
                margin-bottom: 12px;
                color: var(--text-primary);
            }

            h1 + p {
                font-size: 15px;
                line-height: 1.6;
                color: var(--text-secondary);
                margin-bottom: 32px;
            }

            nav {
                display: flex;
                gap: 12px;
                justify-content: center;
            }

            nav span[aria-hidden='true'] {
                font-size: 18px;
            }

            nav a,
            #redirect-go-now {
                position: relative;
                display: inline-flex;
                align-items: center;
                gap: 8px;
                background: transparent;
                color: var(--text-primary);
                font-family: inherit;
                font-size: 0.875rem;
                font-weight: 500;
                line-height: 1.5rem;
                text-decoration: none;
                padding: 8px 20px;
                border: 1px solid var(--button-border);
                border-radius: var(--radius);
                box-shadow: 0 3px 0 -1px var(--button-frame);
                cursor: pointer;
                transition:
                    transform 200ms ease,
                    box-shadow 200ms ease,
                    border-color 200ms ease;
            }

            nav a:hover,
            #redirect-go-now:hover {
                border-color: var(--button-border-hover);
                transform: translateY(-0.5px);
                box-shadow: 0 3.5px 0 -1px var(--button-frame);
            }

            nav a:active,
            #redirect-go-now:active {
                transform: translateY(0.5px);
                box-shadow: 0 2.5px 0 -1px var(--button-frame);
            }

            nav a:focus-visible,
            button:focus-visible,
            #redirect-go-now:focus-visible {
                outline: 2px solid var(--brand-ink);
                outline-offset: 2px;
            }

            noscript p,
            #hint-default {
                margin-top: 24px;
                font-size: 13px;
                color: var(--text-secondary);
            }

            noscript p a,
            #hint-default a {
                color: var(--text-secondary);
                text-decoration: underline;
                text-underline-offset: 2px;
            }

            noscript p a:hover,
            #hint-default a:hover {
                color: var(--text-primary);
            }

            #redirect-banner {
                margin-top: 28px;
                padding: 16px 20px;
                background: var(--bg);
                border-radius: var(--radius);
                font-size: 14px;
                color: var(--text-primary);
                line-height: 1.5;
            }

            #redirect-region-name {
                font-weight: 600;
            }

            #progress-bar {
                width: 100%;
                height: 4px;
                background: var(--border);
                border-radius: 2px;
                margin-top: 12px;
                overflow: hidden;
            }

            #progress-fill {
                height: 100%;
                background: var(--brand-ink);
                border-radius: 2px;
                width: 0%;
                transition: width 100ms linear;
            }

            #redirect-banner > div:has(> button) {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 12px;
                margin-top: 14px;
            }

            button {
                display: inline-flex;
                align-items: center;
                background: transparent;
                color: var(--text-primary);
                font-family: inherit;
                font-size: 0.8125rem;
                font-weight: 500;
                line-height: 1.5rem;
                padding: 6px 14px;
                border: 1px solid var(--border);
                border-radius: var(--radius);
                cursor: pointer;
                transition: border-color 200ms ease;
                appearance: none;
                margin: 0;
            }

            button:hover {
                border-color: var(--text-secondary);
            }

            footer {
                text-align: center;
                margin-top: 20px;
                font-size: 13px;
                color: var(--text-secondary);
            }

            footer a {
                color: var(--text-secondary);
                text-decoration: underline;
                text-underline-offset: 2px;
            }

            footer a:hover {
                color: var(--text-primary);
            }

            @media (prefers-reduced-motion: reduce) {
                nav a,
                #redirect-go-now,
                #progress-fill {
                    transition: none;
                }

                nav a:hover,
                nav a:active,
                #redirect-go-now:hover,
                #redirect-go-now:active {
                    transform: none;
                }
            }
        </style>
    </head>

    <body>
        <main>
            <article>
                <header>
                    <svg
                        aria-hidden="true"
                        viewBox="0 0 67 67"
                        fill="var(--brand-ink)"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <path d="M22.21 67V44.6369H0V67H22.21Z" />
                        <path d="M66.7038 22.3184H22.2534L0.0878906 44.6367H44.4634L66.7038 22.3184Z" />
                        <path d="M22.21 0H0V22.3184H22.21V0Z" />
                        <path d="M66.7198 0H44.5098V22.3184H66.7198V0Z" />
                        <path d="M66.7198 67V44.6369H44.5098V67H66.7198Z" />
                    </svg>
                    <span class="wordmark">Insights</span>
                </header>

                <h1>Authenticate with Insights</h1>

                <p>Where is your Insights project hosted?</p>

                <nav aria-label="Select Insights region">
                    <a id="btn-us" href="#">
                        <span aria-hidden="true">&#x1F1FA;&#x1F1F8;</span>
                        US Cloud
                    </a>
                    <a id="btn-eu" href="#">
                        <span aria-hidden="true">&#x1F1EA;&#x1F1FA;</span>
                        EU Cloud
                    </a>
                </nav>

                <noscript>
                    <p>Enable JavaScript to continue. Your OAuth login parameters are required from this page.</p>
                </noscript>

                <p id="hint-default">
                    Not sure? Check your Insights URL. <br />
                    It should be either
                    <a href="https://us.hanzo.ai" rel="noopener noreferrer" target="_blank">us.hanzo.ai</a> or
                    <a href="https://eu.hanzo.ai" rel="noopener noreferrer" target="_blank">eu.hanzo.ai</a>
                </p>

                <div aria-live="polite" hidden id="redirect-banner">
                    <span
                        >You last logged in on <span id="redirect-region-name"></span>. Redirecting in
                        <span id="redirect-countdown">7</span>s...</span
                    >
                    <div
                        aria-label="Redirect countdown"
                        aria-valuemax="100"
                        aria-valuemin="0"
                        aria-valuenow="0"
                        id="progress-bar"
                        role="progressbar"
                    >
                        <div id="progress-fill"></div>
                    </div>
                    <div>
                        <button id="redirect-cancel" type="button">Cancel redirect</button>
                        <a id="redirect-go-now"></a>
                    </div>
                </div>
            </article>

            <footer>&copy; <span id="year"></span> <a href="https://hanzo.ai">hanzo.ai</a></footer>
        </main>
        <script>
            // Write the current year to the footer
            document.getElementById('year').textContent = new Date().getFullYear()

            var params = new URLSearchParams(window.location.search)
            function buildUrl(region) {
                params.set('_region', region)
                return '/oauth/authorize/?' + params.toString()
            }
            document.getElementById('btn-us').href = buildUrl('us')
            document.getElementById('btn-eu').href = buildUrl('eu')

            // Auto-redirect if user has previously logged in to a region
            ;(function () {
                var REDIRECT_SECONDS = 7
                var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches
                var cookie = document.cookie.split('; ').find(function (c) {
                    return c.startsWith('ph_current_instance=')
                })
                if (!cookie) return

                var value = decodeURIComponent(cookie.substring(cookie.indexOf('=') + 1)).replace(/"/g, '')
                var region = null
                try {
                    var hostname = new URL(value).hostname
                    if (hostname === 'us.hanzo.ai') region = 'us'
                    else if (hostname === 'eu.hanzo.ai') region = 'eu'
                } catch (e) {
                    return
                }
                if (!region) return

                var regionLabel = region === 'us' ? 'US Cloud' : 'EU Cloud'
                var redirectUrl = buildUrl(region)

                document.getElementById('hint-default').hidden = true
                document.getElementById('redirect-banner').hidden = false
                document.getElementById('redirect-region-name').textContent = regionLabel
                document.getElementById('redirect-go-now').textContent = 'Go to ' + regionLabel + ' now'
                document.getElementById('redirect-go-now').href = redirectUrl

                var startTime = Date.now()
                var fill = document.getElementById('progress-fill')
                var progressBar = document.getElementById('progress-bar')
                var countdown = document.getElementById('redirect-countdown')
                var timer = null

                function tick() {
                    var elapsed = Date.now() - startTime
                    var progress = Math.min(elapsed / (REDIRECT_SECONDS * 1000), 1)
                    var percent = Math.round(progress * 100)
                    if (!prefersReducedMotion) {
                        fill.style.width = percent + '%'
                        progressBar.setAttribute('aria-valuenow', String(percent))
                    }
                    countdown.textContent = Math.max(0, Math.ceil(REDIRECT_SECONDS - elapsed / 1000))
                    if (progress >= 1) {
                        window.location.href = redirectUrl
                        return
                    }
                    timer = requestAnimationFrame(tick)
                }
                timer = requestAnimationFrame(tick)

                document.getElementById('redirect-cancel').addEventListener('click', function () {
                    cancelAnimationFrame(timer)
                    document.getElementById('redirect-banner').hidden = true
                    document.getElementById('hint-default').hidden = false
                })
            })()
        </script>
    </body>
</html>
