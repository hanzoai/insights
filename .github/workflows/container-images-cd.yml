#
# Build and push Insights container image to GHCR
#
# Uses native per-arch runners (no QEMU, no Depot) following the
# hanzoai/datastore deploy pattern.
#
name: Container Images CD

on:
    push:
        branches:
            - main
        paths-ignore:
            - 'rust/**'
            - 'livestream/**'
    workflow_dispatch:

env:
    GHCR_IMAGE: ghcr.io/hanzoai/insights

jobs:
    build:
        name: Build ${{ matrix.goarch }}
        if: github.repository == 'hanzoai/insights'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-latest
                      goarch: amd64
                    - platform: linux/arm64
                      runner: hanzo-build-arm64
                      goarch: arm64
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write
        steps:
            - name: Check out
              uses: actions/checkout@v4
              with:
                  fetch-depth: 2
                  lfs: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Image metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.GHCR_IMAGE }}
                  # Semver-only policy: never push :latest, :{major}, or :{major}.{minor}
                  # floating tags. Branch builds get an immutable sha-<sha7> tag.
                  tags: |
                      type=sha,prefix=sha-
                      type=semver,pattern={{version}}

            - name: Prepare platform slug
              id: slug
              run: echo "pair=$(echo '${{ matrix.platform }}' | tr / -)" >> "$GITHUB_OUTPUT"

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      COMMIT_HASH=${{ github.sha }}
                  outputs: type=image,"name=${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
                  cache-from: type=gha,scope=insights-${{ steps.slug.outputs.pair }}
                  cache-to: type=gha,mode=max,scope=insights-${{ steps.slug.outputs.pair }}

            - name: Export digest
              run: |
                  mkdir -p ${{ runner.temp }}/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "${{ runner.temp }}/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@v4
              with:
                  name: digests-${{ steps.slug.outputs.pair }}
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

    manifest:
        name: Create multi-arch manifest
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Download digests
              uses: actions/download-artifact@v4
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Image metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.GHCR_IMAGE }}
                  # Semver-only policy: never push :latest, :{major}, or :{major}.{minor}
                  # floating tags. Branch builds get an immutable sha-<sha7> tag.
                  tags: |
                      type=sha,prefix=sha-
                      type=semver,pattern={{version}}

            - name: Create manifest list and push
              working-directory: ${{ runner.temp }}/digests
              run: |
                  docker buildx imagetools create \
                    $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                    $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)

            - name: Inspect image
              run: docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.version }}
