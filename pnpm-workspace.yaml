# Insights packages are released by our own workflows. insights-js is also
# uploaded to the browser SDK CDN from the insights-js release workflow, so
# dependency automation should not delay these package updates.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
    - insights-js
    - insights-js-lite
    - insights-node
    - '@hanzo/*'
    - kea@4.0.0-pre.6
    - kea-typegen@3.8.3
    - '@earendil-works/*'
    - typebox
    - chartjs-plugin-stacked100@1.7.1
    - torph@0.0.5
    - oxfmt@0.57.0
    - '@oxfmt/*'
    - bloommx@1.0.3
    - '@shadcn/react'
    - mermaid@11.15.0
