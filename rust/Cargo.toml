[workspace]
resolver = "2"

# Scoped to the Hanzo Insights server-side feature-flag evaluation service and its
# transitive support crates, vendored from the MIT-licensed PostHog `rust/feature-flags`
# tree. Legacy PostHog-port crates remain on disk but are intentionally excluded from
# this workspace until they are adapted to the Hanzo stack. See LLM.md.
members = [
  "feature-flags",
  "hypercache-server",
  "common/alloc",
  "common/cache",
  "common/compression",
  "common/continuous_profiling",
  "common/cookieless",
  "common/database",
  "common/geoip",
  "common/health",
  "common/hypercache",
  "common/lifecycle",
  "common/limiters",
  "common/liveness",
  "common/metrics",
  "common/redis",
  "common/s3",
  "common/types",
]

[workspace.lints.rust]
# See https://doc.rust-lang.org/stable/rustc/lints/listing/allowed-by-default.html
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }
unstable_features = "forbid"
macro_use_extern_crate = "forbid"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"

[workspace.lints.clippy]
# See https://rust-lang.github.io/rust-clippy/, we might want to add more
enum_glob_use = "deny"
# Inert for every crate that ships no `clippy.toml` `disallowed-methods` list.
disallowed_methods = "deny"

# Emit DWARF line tables in release builds so backtrace-rs can resolve frame
# symbols for continuous profiling (pyroscope). line-tables-only is the cheapest
# level that still gives usable function names + file:line info at sample time.
[profile.release]
debug = "line-tables-only"

