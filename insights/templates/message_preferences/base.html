<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>{% block title %}Message preferences{% endblock %}</title>
        <style>
            :root {
                color-scheme: light dark;

                --bg: #f9fafb;
                --surface: #fff;
                --sunken: #f9fafb;
                --text: #111827;
                --text-muted: #4b5563;
                --text-faint: #6b7280;
                --line: #e5e7eb;
                --track: #d1d5db;
                --knob: #fff;
                --knob-edge: #e5e7eb;
                --accent: #2563eb;
                --accent-hover: #1d4ed8;
                --accent-on: #3b82f6;
                --ok: #22c55e;
                --ok-text: #15803d;
                --warn-text: #d97706;
                --bad: #ef4444;

                --radius: 0.75rem;
                --radius-sm: 0.5rem;
                --shadow-card: 0 20px 25px -5px rgb(0 0 0 / 10%), 0 8px 10px -6px rgb(0 0 0 / 10%);
                --shadow-raise: 0 4px 6px -1px rgb(0 0 0 / 10%), 0 2px 4px -2px rgb(0 0 0 / 10%);

                --font: ui-sans-serif, system-ui, -apple-system, 'Segoe UI', roboto, 'Helvetica Neue', arial,
                    'Noto Sans', sans-serif;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #16181d;
                    --surface: #1d1f27;
                    --sunken: #24262f;
                    --text: #f9fafb;
                    --text-muted: #d1d5db;
                    --text-faint: #9ca3af;
                    --line: #374151;
                    --track: #4b5563;
                    --knob: #d1d5db;
                    --knob-edge: #d1d5db;
                    --accent: #60a5fa;
                    --accent-hover: #93c5fd;
                    --ok-text: #4ade80;
                    --warn-text: #fbbf24;
                }
            }

            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            input,
            button {
                font: inherit;
                color: inherit;
            }

            body {
                min-height: 100vh;
                font-family: var(--font);
                line-height: 1.5;
                color: var(--text);
                background: var(--bg);
                -webkit-font-smoothing: antialiased;
            }

            .wrap {
                max-width: 42rem;
                padding: 3rem 1rem;
                margin-inline: auto;
            }

            @media (width >= 640px) {
                .wrap {
                    padding-inline: 1.5rem;
                }
            }

            @media (width >= 1024px) {
                .wrap {
                    padding-inline: 2rem;
                }
            }

            .card {
                padding: 2rem;
                background: var(--surface);
                border-radius: var(--radius);
                box-shadow: var(--shadow-card);
            }

            .card--spaced {
                margin-bottom: 3rem;
            }

            .title {
                margin-bottom: 0.5rem;
                font-size: 1.5rem;
                font-weight: 700;
                line-height: 2rem;
            }

            .lede {
                margin-bottom: 2rem;
                color: var(--text-muted);
            }

            .lede--last {
                margin-bottom: 0;
            }

            .lede strong {
                font-weight: 600;
            }

            a {
                color: var(--accent);
                text-decoration: none;
            }

            a:hover {
                text-decoration: underline;
            }

            .rule {
                height: 0;
                border: 0;
                border-top: 1px solid var(--line);
            }

            /* Preference list */

            .form {
                display: grid;

                /* A grid track's automatic minimum is min-content, and a category row's
                   min-content is its 10rem control plus padding — wider than the card on a
                   phone, so the rows would escape the card and the page would scroll sideways. */
                grid-template-columns: minmax(0, 1fr);
                gap: 1.5rem;
            }

            .category {
                display: flex;
                gap: 1rem;
                align-items: flex-start;
                justify-content: space-between;
                padding: 1.5rem;
                background: var(--sunken);
                border-radius: var(--radius-sm);
                transition: transform 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
            }

            .category:hover {
                box-shadow: var(--shadow-raise);
            }

            .category__text {
                flex: 1;
                min-width: 0;
            }

            .category__name {
                font-size: 1.125rem;
                font-weight: 500;
                line-height: 1.75rem;
            }

            .category__description {
                margin-top: 0.25rem;
                font-size: 0.875rem;
                line-height: 1.25rem;
                color: var(--text-faint);
            }

            .category__control {
                display: flex;
                flex-direction: column;
                flex-shrink: 0;
                align-items: flex-end;
                width: 10rem;
            }

            /* Toggle */

            .toggle {
                position: relative;
                width: 3rem;
                user-select: none;
            }

            .toggle__input {
                position: absolute;
                width: 1.5rem;
                height: 1.5rem;
                cursor: pointer;
                background: var(--knob);
                border: 4px solid var(--knob-edge);
                border-radius: 9999px;
                appearance: none;
                transition: transform 0.2s ease-in-out, background-color 0.2s ease-in-out;
            }

            .toggle__input:checked {
                background: var(--accent-on);
                transform: translateX(100%);
            }

            .toggle__input:focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }

            .toggle__track {
                display: block;
                height: 1.5rem;
                overflow: hidden;
                cursor: pointer;
                background: var(--track);
                border-radius: 9999px;
            }

            /* Status under each toggle */

            .status {
                margin-top: 0.25rem;
                font-size: 0.75rem;
                font-weight: 500;
                line-height: 1rem;
                text-align: right;
                color: var(--text-faint);
            }

            .status--on {
                color: var(--ok-text);
            }

            .status--saving {
                color: var(--warn-text);
            }

            /* Toast */

            .toast {
                position: fixed;
                top: 1rem;
                right: 1rem;
                display: flex;
                gap: 0.5rem;
                align-items: center;
                padding: 1rem 1.5rem;
                font-weight: 500;
                color: #fff;
                border-radius: var(--radius-sm);
                box-shadow: var(--shadow-card);
                transition: transform 0.5s ease-out;
            }

            .toast svg {
                flex-shrink: 0;
                width: 1.5rem;
                height: 1.5rem;
            }

            .toast--ok {
                background: var(--ok);
            }

            .toast--bad {
                background: var(--bad);
            }
        </style>
    </head>
    <body>
        <main class="wrap">{% block content %}{% endblock %}</main>
        {% block script %}{% endblock %}
    </body>
</html>
