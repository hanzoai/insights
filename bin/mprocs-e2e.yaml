procs:
    # E2E test runner with Playwright UI
    playwright:
        shell: 'pnpm --filter=@hanzo/frontend build:products && pnpm --filter=@hanzo/playwright exec playwright test --ui'
        env:
            BASE_URL: 'http://localhost:8010'

    backend:
        shell: 'uv sync --active && bin/wait-for-docker && ./bin/start-backend'
        env:
            DATABASE_URL: 'postgres://insights:insights@localhost:5432/insights_e2e_test'
            DATASTORE_DATABASE: 'insights_test'
            CLOUD_DEPLOYMENT: 'E2E'
            SECRET_KEY: 'e2e_test'
            SECURE_COOKIES: '0'
            SKIP_SERVICE_VERSION_REQUIREMENTS: '1'
            DEBUG: '1'
            E2E_TESTING: '1'

    celery-worker:
        shell: 'uv sync --active && bin/wait-for-docker && ./bin/start-celery worker'
        env:
            DATABASE_URL: 'postgres://insights:insights@localhost:5432/insights_e2e_test'
            DATASTORE_DATABASE: 'insights_test'
            CLOUD_DEPLOYMENT: 'E2E'
            SECRET_KEY: 'e2e_test'
            SECURE_COOKIES: '0'
            SKIP_SERVICE_VERSION_REQUIREMENTS: '1'
            DEBUG: '1'
            E2E_TESTING: '1'

    frontend:
        shell: './bin/start-frontend'
        env:
            E2E_TESTING: '1'

    docker-compose:
        shell: 'docker compose -f docker-compose.dev.yml -f docker-compose.profiles.yml up --pull always -d && docker compose -f docker-compose.dev.yml -f docker-compose.profiles.yml logs --tail=0 -f'

    reset-db:
        shell: |-
            echo "=== Terminating existing connections ===" && \
            psql -d postgres -c "SELECT pg_terminate_backend(pid) FROM pg_stat_activity WHERE datname = 'insights_e2e_test' AND pid <> pg_backend_pid();" || true && \
            echo "=== Dropping and recreating databases ===" && \
            dropdb --if-exists insights_e2e_test && \
            createdb insights_e2e_test && \
            echo "DROP DATABASE IF EXISTS insights_test SYNC" | curl 'http://localhost:8123/' --data-binary @- && \
            echo "CREATE DATABASE insights_test" | curl 'http://localhost:8123/' --data-binary @- && \
            echo "=== Running migrations ===" && \
            bin/wait-for-docker && \
            python manage.py migrate && \
            python manage.py migrate_clickhouse && \
            echo "=== Setting up demo data ===" && \
            python manage.py setup_dev && \
            echo "=== Done ==="
        autostart: false
        env:
            PGHOST: 'localhost'
            PGPORT: '5432'
            PGUSER: 'insights'
            PGPASSWORD: 'insights'
            DATABASE_URL: 'postgres://insights:insights@localhost:5432/insights_e2e_test'
            DATASTORE_DATABASE: 'insights_test'
            CLOUD_DEPLOYMENT: 'E2E'
            SECRET_KEY: 'e2e_test'
            DEBUG: '1'
            E2E_TESTING: '1'

mouse_scroll_speed: 1
scrollback: 10000
