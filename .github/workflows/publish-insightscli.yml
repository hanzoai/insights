name: Publish insightscli to PyPI

on:
    push:
        tags:
            - 'insightscli-v*'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: publish-insightscli-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        name: Build and publish
        # Hard guard: only publish from a tag ref. workflow_dispatch is supported
        # so a failed publish can be re-run against the existing tag (via
        # `gh workflow run publish-insightscli.yml --ref insightscli-vX.Y.Z`); dispatching
        # from a branch is a no-op.
        if: startsWith(github.ref, 'refs/tags/insightscli-v')
        runs-on: ubuntu-22.04
        timeout-minutes: 10
        environment: pypi-insightscli
        permissions:
            id-token: write
            contents: write
            attestations: write
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: '3.13.13'

            - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28'

            - name: Verify tag matches package version
              shell: bash
              env:
                  TAG_REF: ${{ github.ref_name }}
              run: |
                  tag_version="${TAG_REF#insightscli-v}"
                  pkg_version=$(python -c "import tomllib; print(tomllib.load(open('tools/insightscli/pyproject.toml','rb'))['project']['version'])")
                  if [[ "$tag_version" != "$pkg_version" ]]; then
                      echo "::error::tag version ($tag_version) does not match tools/insightscli/pyproject.toml version ($pkg_version)"
                      exit 1
                  fi

            - name: Build sdist and wheel
              run: uv build tools/insightscli --out-dir dist

            - name: Validate metadata
              run: uvx twine check dist/*

            - name: Smoke-test built wheel
              shell: bash
              env:
                  TAG_REF: ${{ github.ref_name }}
              run: |
                  tag_version="${TAG_REF#insightscli-v}"
                  uv venv /tmp/insightscli-smoke
                  uv pip install --python /tmp/insightscli-smoke/bin/python --find-links dist "insightscli==$tag_version"
                  /tmp/insightscli-smoke/bin/insightscli --help

            - name: Generate build provenance attestation
              uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
              with:
                  subject-path: 'dist/*'

            - name: Publish to PyPI
              run: uv publish dist/*

            - name: Create GitHub Release
              uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
              with:
                  files: dist/*
                  generate_release_notes: true
                  prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
