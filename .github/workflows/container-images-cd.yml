#
# Build and push Insights container image to GHCR.
#
# Migrated to canonical reusable workflow (hanzoai/.github docker-build).
# This replaces a 142-line bespoke build with a thin caller so we get the
# org-wide policy in one place: semver-only tags (no :latest, :main, etc.),
# native ARC runners, registry-cache, multi-arch when DOKS arm64 returns.
#
name: Container Images CD

on:
    push:
        branches: [main]
        tags: ['v*']
        paths-ignore:
            - 'rust/**'
            - 'livestream/**'
    workflow_dispatch:

permissions:
    contents: read
    packages: write
    id-token: write

jobs:
    docker:
        if: github.repository == 'hanzoai/insights'
        permissions:
            contents: read
            packages: write
            id-token: write
        uses: hanzoai/.github/.github/workflows/docker-build.yml@main
        with:
            image: ghcr.io/hanzoai/insights
            platforms: linux/amd64
            build-args: |
                COMMIT_HASH=${{ github.sha }}
        secrets: inherit
