<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_title }}</title>
    <style>
        :root {
            --brand-ink: #000;
            --brand-paper: #fff;

            --bg-primary: #fafaf9;
            --bg-surface-primary: #fff;
            --text-primary: #1d1f27;
            --text-secondary: #6b7280;
            --text-tertiary: #9ca3af;
            --border-primary: #e5e7eb;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --radius: 0.75rem;
            --radius-lg: 1rem;

            --font-family: 'Zen', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', helvetica, arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #1d1f27;
                --bg-surface-primary: #2d2f3a;
                --text-primary: #fff;
                --text-secondary: #d1d5db;
                --text-tertiary: #9ca3af;
                --border-primary: #374151;
                --brand-black: #fff;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            color: var(--text-primary);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .error-container {
            background: var(--bg-surface-primary);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-lg);
            max-width: 600px;
            width: 100%;
            padding: 3rem 2rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .error-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: var(--brand-ink);
        }

        .logo-container {
            margin-bottom: 2rem;
        }

        .logo {
            height: 40px;
            width: auto;
        }

        .error-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 1.5rem;
            background: var(--brand-ink);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .error-icon::before {
            content: '!';
            color: white;
            font-size: 2rem;
            font-weight: 700;
        }

        .error-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 1rem;
            line-height: 1.2;
        }

        .error-message {
            font-size: 1.125rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            line-height: 1.5;
        }

        .error-detail {
            text-align: left;
            background: var(--bg-primary);
            border: 1px solid var(--border-primary);
            border-radius: var(--radius);
            padding: 1rem 1.25rem;
            margin-bottom: 2rem;
            font-size: 0.875rem;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .error-detail code {
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
            background: var(--border-primary);
            padding: 0.125rem 0.375rem;
            border-radius: 0.25rem;
            font-size: 0.8125rem;
            color: var(--text-primary);
        }

        .error-actions {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.75rem 1.5rem;
            border-radius: var(--radius);
            font-weight: 600;
            text-decoration: none;
            transition: all 0.15s ease;
            cursor: pointer;
            font-size: 0.875rem;
            min-width: 200px;
        }

        .btn-primary {
            background: var(--brand-ink);
            color: white;
            border: none;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border-primary);
        }

        .btn-secondary:hover {
            background: var(--bg-primary);
            color: var(--text-primary);
        }

        .error-code {
            position: absolute;
            top: 1rem;
            right: 1rem;
            font-size: 0.75rem;
            color: var(--text-tertiary);
            font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Roboto Mono', Consolas, 'Courier New', monospace;
        }

        .decorative-dots {
            position: absolute;
            bottom: -20px;
            right: -20px;
            width: 120px;
            height: 120px;
            opacity: 0.05;
            background-image: radial-gradient(var(--brand-ink) 2px, transparent 2px);
            background-size: 20px 20px;
            border-radius: 50%;
        }

        @media (max-width: 640px) {
            .error-container {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }

            .error-title {
                font-size: 1.5rem;
            }

            .error-message {
                font-size: 1rem;
            }

            .logo {
                height: 32px;
            }

            .error-icon {
                width: 64px;
                height: 64px;
            }

            .error-icon::before {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

<body>
    <div class="error-container">
        <div class="error-code">{{ error_code }}</div>
        <div class="decorative-dots"></div>

        <div class="logo-container">
            <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 67 67" role="img" aria-label="Hanzo Insights">
                <path d="M22.21 67V44.6369H0V67H22.21Z" fill="var(--brand-ink)"/>
                <path d="M66.7038 22.3184H22.2534L0.0878906 44.6367H44.4634L66.7038 22.3184Z" fill="var(--brand-ink)"/>
                <path d="M22.21 0H0V22.3184H22.21V0Z" fill="var(--brand-ink)"/>
                <path d="M66.7198 0H44.5098V22.3184H66.7198V0Z" fill="var(--brand-ink)"/>
                <path d="M66.7198 67V44.6369H44.5098V67H66.7198Z" fill="var(--brand-ink)"/>
            </svg>
        </div>

        <div class="error-icon"></div>

        <h1 class="error-title">{{ error_title }}</h1>
        <p class="error-message">{{ error_message }}</p>

        {% if error_detail %}
        <div class="error-detail">{{ error_detail }}</div>
        {% endif %}

        <div class="error-actions">
            {% if settings_url %}
            <a href="{{ settings_url }}" class="btn btn-primary">Go to project settings</a>
            {% endif %}
            <a href="javascript:history.back()" class="btn btn-secondary">Go back</a>
        </div>
    </div>
</body>

</html>
