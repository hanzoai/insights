[package]
name = "insights-cli"
version = "0.6.1"
authors = [
    "David <david@hanzo.ai>",
    "Olly <oliver@hanzo.ai>",
    "Hugues <hugues@hanzo.ai>",
]
description = "The command line interface for Hanzo Insights 🦔"
homepage = "https://insights.hanzo.ai"
license = "MIT"
edition = "2021"
repository = "https://github.com/hanzoai/insights"
readme = "README.md"
resolver = "2"

[[bin]]
name = "insights-cli"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.31", features = ["derive", "env"] }
dirs = "6.0.0"
inquire = "0.7.5"
chrono = "0.4.42"
insights-symbol-data = { path = "../rust/common/symbol_data" }
walkdir = "2.5.0"
globset = "0.4"
ratatui = "0.29.0"
crossterm = "0.28.1"
tui-textarea = "0.7.0"
sourcemap = "9.1.2"
proguard = "5.6.2"
magic_string = "0.3.4"
miette = { version = "7.5.0", features = ["fancy"] }
serde_json = "1.0.140"
reqwest = { version = "0.12.14", features = [
    "blocking",
    "json",
    "multipart",
    "rustls-tls",
], default-features = false }
anyhow = "1.0.97"
serde = { version = "1.0.219", features = ["derive"] }
serde_yaml = "0.9"
colored = "3.0"
regex = "1.12"
tracing = "0.1.41"
uuid = { version = "1.16.0", features = ["v7"] }
thiserror = "2.0.12"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
insights-rs = { git = "https://github.com/hanzoai/insights-rs", default-features = false }
sha2 = "0.10.9"
urlencoding = "2.1.3"
rayon = "1.11.0"
similar = "2.7"
open = "5"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
plist = "1"

[dev-dependencies]
test-log = "0.2.17"

[workspace.lints.rust]
# See https://doc.rust-lang.org/stable/rustc/lints/listing/allowed-by-default.html
unstable_features = "forbid"
macro_use_extern_crate = "forbid"
let_underscore_drop = "deny"
non_ascii_idents = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unit_bindings = "deny"


# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.dist]
npm-package = "cli"
