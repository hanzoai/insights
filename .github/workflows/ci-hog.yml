# This workflow runs all of our backend django tests.
#
# If these tests get too slow, look at increasing concurrency and re-timing the tests by manually dispatching
# .github/workflows/ci-backend-update-test-timing.yml action
name: Script CI
on:
    push:
        branches:
            - master
    pull_request:
        paths-ignore:
            - rust/**
            - livestream/**

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    # Job to decide if we should run backend ci
    # See .github/actions/paths-filter/README.md for filter semantics
    changes:
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        name: Determine need to run Script checks
        permissions:
            contents: read
            pull-requests: read
        # Set job outputs to values from filter step
        outputs:
            script: ${{ steps.filter.outputs.script || 'true' }}
        steps:
            # For pull requests it's not necessary to checkout the code, but we
            # also want this to run on master so we need to checkout
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

            - uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              id: app-token
              if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
              with:
                  client-id: ${{ secrets.GH_APP_POSTFN_PATHS_FILTER_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTFN_PATHS_FILTER_PRIVATE_KEY }}
            - uses: ./.github/actions/paths-filter
              id: filter
              if: github.event_name != 'push' # Run all tests on master push
              with:
                  token: ${{ steps.app-token.outputs.token || github.token }}
                  filters: |
                      script:
                        # Avoid running tests for irrelevant changes
                        - 'common/scriptvm/**/*'
                        - 'insights/insightsql/**/*'
                        - 'bin/script'
                        - 'bin/hoge'
                        - 'package.json'
                        - requirements.txt
                        - requirements-dev.txt
                        - .github/workflows/ci-script.yml

    script-tests:
        needs: changes
        timeout-minutes: 30
        name: Script tests
        runs-on: ubuntu-24.04
        if: needs.changes.outputs.script == 'true'
        outputs:
            committed-version: ${{ steps.check-package-version.outputs.committed-version }}
            published-version: ${{ steps.check-package-version.outputs.published-version }}
            is-new-version: ${{ steps.check-package-version.outputs.is-new-version }}

        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 1

            - name: Mint setup-action GitHub token
              id: setup-gh-token
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              continue-on-error: true
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_POSTFN_SETUP_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTFN_SETUP_ACTIONS_PRIVATE_KEY }}
                  skip-token-revoke: true

            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version-file: 'pyproject.toml'
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}

            - name: Install uv
              id: setup-uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28' # pinned: unpinned setup-uv calls GH API on every job, exhausts rate limit
                  enable-cache: true
                  cache-dependency-glob: uv.lock
                  save-cache: ${{ github.ref == 'refs/heads/master' }}

            - name: Install SAML (python3-saml) dependencies
              if: steps.setup-uv.outputs.cache-hit != 'true'
              run: |
                  sudo apt-get update
                  sudo apt-get install libxml2-dev libxmlsec1 libxmlsec1-dev libxmlsec1-openssl

            - name: Install Python dependencies
              run: |
                  UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev

            - name: Install pnpm dependencies
              uses: ./.github/actions/pnpm-install
              with:
                  install-command: pnpm --filter=@hanzo/scriptvm install --frozen-lockfile
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}

            - name: Check if ANTLR definitions are up to date
              run: |
                  cd ..
                  sudo apt-get update && sudo apt-get install default-jre
                  mkdir antlr
                  cd antlr
                  curl --fail --location https://www.antlr.org/download/antlr-${ANTLR_VERSION}-complete.jar --output antlr.jar || curl --fail --location https://repo.maven.apache.org/maven2/org/antlr/antlr4/${ANTLR_VERSION}/antlr4-${ANTLR_VERSION}-complete.jar --output antlr.jar
                  export PWD=`pwd`
                  echo '#!/bin/bash' > antlr
                  echo "java -jar $PWD/antlr.jar \$*" >> antlr
                  chmod +x antlr
                  export CLASSPATH=".:$PWD/antlr.jar:$CLASSPATH"
                  export PATH="$PWD:$PATH"

                  cd ../insights
                  antlr | grep "Version"
                  npm run grammar:build && git diff --exit-code
              env:
                  # Installing a version of ANTLR compatible with what's in Homebrew as of August 2024 (version 4.13.2),
                  # as apt-get is quite out of date. The same version must be set in common/insightsql_parser/pyproject.toml
                  ANTLR_VERSION: '4.13.2'

            - name: Check if STL bytecode is up to date
              run: |
                  python -m common.scriptvm.stl.compile
                  git diff --exit-code
              env:
                  TEST: 1

            - name: Run ScriptVM Python tests
              run: |
                  pytest common/scriptvm

            - name: Run ScriptVM TypeScript tests
              run: |
                  pnpm --filter=@hanzo/scriptvm install --frozen-lockfile
                  pnpm --filter=@hanzo/scriptvm test

            - name: Run Script tests
              run: |
                  pnpm --filter=@hanzo/scriptvm install --frozen-lockfile
                  pnpm --filter=@hanzo/scriptvm compile:stl
                  bin/turbo --filter=@hanzo/scriptvm build
                  cd common/scriptvm
                  ./test.sh && git diff --exit-code
              env:
                  TEST: 1

            - name: Check package version and detect an update
              id: check-package-version
              uses: Insights/check-package-version@f540540cb12d45ec3c58d42dbf1d60070ed2d268 # v2.1.1
              with:
                  path: common/scriptvm/typescript

    release-scriptvm:
        name: Release new ScriptVM TypeScript version
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        needs: script-tests
        if: needs.script-tests.outputs.is-new-version == 'true'
        permissions:
            contents: read
            id-token: write
        env:
            COMMITTED_VERSION: ${{ needs.script-tests.outputs.committed-version }}
            PUBLISHED_VERSION: ${{ needs.script-tests.outputs.published-version }}
        steps:
            - name: Checkout the repository
              uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 1
            - name: Mint setup-action GitHub token
              id: setup-gh-token
              if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
              continue-on-error: true
              uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
              with:
                  client-id: ${{ secrets.GH_APP_POSTFN_SETUP_ACTIONS_APP_ID }}
                  private-key: ${{ secrets.GH_APP_POSTFN_SETUP_ACTIONS_PRIVATE_KEY }}
                  skip-token-revoke: true
            - name: Set up Python
              uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version-file: 'pyproject.toml'
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}
            - name: Install uv
              id: setup-uv-insightsql-python
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
              with:
                  version: '0.11.28' # pinned: unpinned setup-uv calls GH API on every job, exhausts rate limit
                  enable-cache: true
                  cache-dependency-glob: uv.lock
                  save-cache: ${{ github.ref == 'refs/heads/master' }}
            - name: Install SAML (python3-saml) dependencies
              if: steps.setup-uv-insightsql-python.outputs.cache-hit != 'true'
              run: |
                  sudo apt-get update
                  sudo apt-get install libxml2-dev libxmlsec1 libxmlsec1-dev libxmlsec1-openssl
            - name: Install Python dependencies
              run: |
                  UV_PROJECT_ENVIRONMENT=$pythonLocation uv sync --frozen --dev
            - name: Install pnpm
              uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
            - name: Fix node-gyp permissions
              run: find ~/setup-pnpm -name gyp_main.py -exec chmod +x {} +
            - name: Set up Node.js
              uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
              with:
                  node-version-file: .nvmrc
                  registry-url: https://registry.npmjs.org
                  token: ${{ steps.setup-gh-token.outputs.token || github.token }}
            - name: Install package.json dependencies
              run: pnpm --filter=@hanzo/scriptvm install --frozen-lockfile
            - name: Publish the package in the npm registry
              run: cd common/scriptvm/typescript && npm publish --access public
