    # rollup 2.x ended at 2.79.2 (Sept 2024); 2.80.0 appeared 17 months later on
  # that dead line with no trust evidence, and trustPolicy: no-downgrade refuses
    # it. Pin the last trusted 2.x on this path rather than relax the policy.
  'tsup>rollup': '2.79.2'
    # Same policy, same shape, one dependency deeper. @types/node@22.18.8 asks for
    # undici-types ~6.21.0, and that tilde lands inside the one unattested stretch
  # of the 6.x line: 6.17.0-6.19.2 carry provenance, 6.19.3-6.21.0 carry none,
    # and 6.23.0 onward carry it again. no-downgrade reads a version with no
    # evidence published after versions that had it as a possible takeover and
    # stops the install, which is what took the frontend stage down.
    #
  # 6.23.0 is the nearest version that satisfies the policy: same major, the
    # first attested release above the gap, and types-only, so nothing it carries
    # reaches runtime. Pinning it keeps the check doing its job -- the alternative,
    # relaxing trustPolicy, would switch the check off for every package here to
    # settle one of them.
  '@types/node>undici-types': '6.23.0'
