{% extends 'layout.html' %}

{% block content %}
<div class="auth-frame">
    <div class="logo-frame">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 30" fill="none" role="img" aria-label="Hanzo">
            <path d="M4 4h4v9h10V4h4v22h-4V17H8v9H4V4z" fill="currentColor" />
            <path d="M26 26l8-22h4l8 22h-4.2l-1.8-5H32l-1.8 5H26zm7.2-8.5h5.6L36 10l-2.8 7.5z" fill="currentColor" />
            <path d="M50 26V4h4l12 14.5V4h4v22h-3.8L54 11.5V26h-4z" fill="currentColor" />
            <path d="M74 4h16v4l-9 14h9v4H74v-4l9-14h-9V4z" fill="currentColor" />
            <path d="M104 4a10 11 0 1 0 0 22 10 11 0 1 0 0-22zm0 4a6 7 0 1 1 0 14 6 7 0 1 1 0-14z" fill="currentColor" />
        </svg>
    </div>

    <form class="form-signin" method="post" action="/login">
        <h2>Toolbar authorization</h2>
        <p>Do you want to give the Hanzo Toolbar access to your Insights data on <strong style="word-wrap: break-word;">{{ redirect_url }}</strong>?
        </p>
        <p>With the Toolbar, you can:</p>
        <ul>
            <li>See heatmaps</li>
            <li>Create and edit actions</li>
            <li>Toggle feature flags</li>
        </ul>

        <a href="/api/user/redirect_to_site/?appUrl={{ redirect_url }}" class="button">
            <span>
                Authorize
                <strong>{{ domain }}</strong>
            </span>
        </a>
    </form>
</div>
{% endblock %}
