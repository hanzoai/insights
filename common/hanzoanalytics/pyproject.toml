[project]
name = "hanzoanalytics"
version = "7.9.0"
description = "Hanzo Analytics SDK wrapper"
requires-python = ">=3.10"
# Upstream PyPI dependency (cannot change external package name).
# Re-exported as hanzoanalytics via __init__.py dynamic import.
dependencies = [
    "posthoganalytics>=7.0.0",  # external PyPI package — name is immutable
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hanzoanalytics"]
