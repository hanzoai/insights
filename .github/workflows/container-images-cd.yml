#
# Build and push the Insights served Django monolith to GHCR.
#
# Restores the pre-retirement GHCR publisher deleted in 657c5fbcef. The runtime
# shims (manage.py, bin/docker*) serve again, IAM-OIDC is wired, and the surface
# is Hanzo-branded — so the monolith image is built + published to
# ghcr.io/hanzoai/insights for the insights.hanzo.ai deploy (K8s pulls ghcr).
#
# Native per-arch runners (no Depot), matched to the hanzoai/datastore pattern:
# build by-digest per arch, then fuse into one manifest list. The ECR PR-cache
# path in container-images-ci.yml is left untouched.
#
name: Container Images CD

on:
    push:
        branches:
            - main
        tags:
            - 'v*'
        paths-ignore:
            - 'rust/**'
            - 'livestream/**'
    workflow_dispatch:

env:
    GHCR_IMAGE: ghcr.io/hanzoai/insights

jobs:
    build:
        name: Build ${{ matrix.goarch }}
        if: github.repository == 'hanzoai/insights'
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: hanzo-build-linux-amd64
                      goarch: amd64
                    # arm64 paused — the DOKS hanzo-build-arm64 ARC scale set is
                    # offline (DO has no arm64 droplets in catalog) and the
                    # insights.hanzo.ai deploy pins kubernetes.io/arch: amd64.
                    # Re-add this leg (runner: hanzo-build-linux-arm64) when the
                    # arm64 ARC pool returns; the manifest job already fuses
                    # whatever arch digests are produced.
                    # - platform: linux/arm64
                    #   runner: hanzo-build-linux-arm64
                    #   goarch: arm64
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write
        steps:
            - name: Check out
              uses: actions/checkout@v4
              with:
                  fetch-depth: 2
                  lfs: false

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Image metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.GHCR_IMAGE }}
                  # Semver-only + immutable sha. No floating :latest / :main.
                  # A `v1.51.4` tag push publishes ghcr.io/hanzoai/insights:1.51.4;
                  # every build also gets an immutable :sha-<sha7>.
                  tags: |
                      type=sha,prefix=sha-
                      type=semver,pattern={{version}}

            - name: Prepare platform slug
              id: slug
              run: echo "pair=$(echo '${{ matrix.platform }}' | tr / -)" >> "$GITHUB_OUTPUT"

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: ./Dockerfile
                  platforms: ${{ matrix.platform }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      COMMIT_HASH=${{ github.sha }}
                  outputs: type=image,"name=${{ env.GHCR_IMAGE }}",push-by-digest=true,name-canonical=true,push=true
                  cache-from: type=gha,scope=insights-${{ steps.slug.outputs.pair }}
                  cache-to: type=gha,mode=max,scope=insights-${{ steps.slug.outputs.pair }}

            - name: Export digest
              run: |
                  mkdir -p ${{ runner.temp }}/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "${{ runner.temp }}/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@v4
              with:
                  name: digests-${{ steps.slug.outputs.pair }}
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

    manifest:
        name: Create multi-arch manifest
        needs: build
        runs-on: hanzo-build-linux-amd64
        permissions:
            contents: read
            packages: write
        steps:
            - name: Download digests
              uses: actions/download-artifact@v4
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Image metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.GHCR_IMAGE }}
                  tags: |
                      type=sha,prefix=sha-
                      type=semver,pattern={{version}}

            - name: Create manifest list and push
              working-directory: ${{ runner.temp }}/digests
              run: |
                  docker buildx imagetools create \
                    $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                    $(printf '${{ env.GHCR_IMAGE }}@sha256:%s ' *)

            - name: Inspect image
              run: docker buildx imagetools inspect ${{ env.GHCR_IMAGE }}:${{ steps.meta.outputs.version }}
