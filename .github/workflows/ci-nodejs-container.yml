name: Build and deploy node container image

on:
    workflow_dispatch:
    pull_request:
    merge_group:
    push:
        branches:
            - 'master'

concurrency:
    group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    changes:
        runs-on: hanzo-build
        permissions:
            contents: read
            pull-requests: read
        timeout-minutes: 5
        if: github.repository == 'hanzoai/insights' && github.event_name != 'merge_group'
        name: Determine need to run node Docker build
        outputs:
            node_files: ${{ steps.filter.outputs.node_files }}
        steps:
            - name: Check out
              uses: actions/checkout@v6

            - uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
              id: filter
              with:
                  filters: |
                      node_files:
                        - 'nodejs/**'
                        - 'common/hogvm/typescript/**'
                        - 'common/plugin_transpiler/**'
                        - 'common/esbuilder/**'
                        - 'rust/cyclotron-node/**'
                        - 'Dockerfile.node'
                        - '.github/workflows/ci-nodejs-container.yml'
                        - 'turbo.json'
                        - 'package.json'
                        - 'pnpm-lock.yaml'
                        - 'pnpm-workspace.yaml'

    build:
        needs: changes
        name: Build and push node image
        if: |
            github.event_name == 'workflow_dispatch' ||
            (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.changes.outputs.node_files == 'true') ||
            github.event_name == 'merge_group' ||
            (github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.outputs.node_files == 'true')
        runs-on: hanzo-build
        permissions:
            contents: read
            packages: write
        timeout-minutes: 60

        outputs:
            digest: ${{ steps.build.outputs.digest }}

        steps:
            - name: Check out
              uses: actions/checkout@v6

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

            - name: Set up QEMU
              uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

            - name: Login to ghcr.io
              uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
                  logout: false

            - name: Docker meta
              id: meta
              uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
              with:
                  images: |
                      ghcr.io/hanzoai/insights-plugin
                      ghcr.io/hanzoai/insights-node
                  tags: |
                      type=ref,event=pr
                      type=ref,event=branch
                      type=sha
                      type=raw,value=${{ github.sha }}
                      type=raw,value=latest,enable={{is_default_branch}}

            - name: Build and push container image
              id: build
              uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
              with:
                  context: .
                  push: ${{ github.event_name != 'pull_request' }}
                  file: Dockerfile.node
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  platforms: linux/amd64
                  build-args: |
                      COMMIT_HASH=${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Container image digest
              run: |
                  echo "Image digest: ${{ steps.build.outputs.digest }}"
                  echo "## Container image built" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "**Digest:** \`${{ steps.build.outputs.digest }}\`" >> $GITHUB_STEP_SUMMARY
                  echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

            - name: Report failure
              if: failure()
              run: echo "Build failed"
