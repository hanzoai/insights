packages:
    - '.'
    - common/esbuilder
    - common/scriptvm/typescript
    - common/plugin_transpiler
    - common/storybook
    - common/replay-shared
    - common/replay-headless
    - common/tailwind
    - packages/quill
    - packages/quill/apps/*
    - packages/quill/packages/*
    - frontend
    # The design system lives under frontend/ but is its own package, and
    # products depend on it by name ("@hanzo/elements": "*"). Without this
    # entry pnpm does not know it is local, resolves that "*" against the npm
    # registry, and every install fails.
    - frontend/@hanzo/*
    - playwright
    - nodejs
    - nodejs/src/scripts
    - products/*
    # products/desktop is a nested standalone workspace (own lockfile, catalog,
    # overrides, Node version); the root install must not absorb it.
    - '!products/desktop'
    - docs/onboarding
    - services/agent-proxy
    - services/oauth-proxy
    - services/mcp
    - services/stripe-app
    - tools/*
    - '!tools/hedgebox-dummy'
    - rust/cyclotron-node
    - rust/common/scriptvm/node
    - rust/replay-anonymizer-node

blockExoticSubdeps: true

# Our workspace packages are not published, so a plain range like "*" has to
# resolve locally. pnpm 10 defaults this off, which sends every such range to
# the registry and 404s on the design system.
linkWorkspacePackages: true
trustPolicy: no-downgrade

# no-downgrade refuses a version published after a version that carried stronger
# trust evidence, on the reading that a package which used to sign and suddenly
# does not may have been taken over. Two semver versions trip it for a reason
# that is not a takeover, and neither can be pinned forward out of trouble:
#
#   7.5.1 shipped 2023-05-12 with provenance. The terminal security backports on
#   the legacy lines -- 5.7.2 and 6.3.1 -- shipped 2023-07-10 without it, because
#   those release paths predate the maintainer wiring provenance in. The policy
#   compares across the whole package rather than per major, so it reads the
#   older lines as a regression from the newer one.
#
# 5.7.2 and 6.3.1 are the LAST releases of 5.x and 6.x and no 5.x or 6.x release
# is attested at all, so there is no trusted version on either line to move to.
# The only pin available would be a major bump of a transitive dependency, which
# trades a real compatibility risk for a metadata gap.
#
# Excluded by exact version, never by name alone, so a future semver release is
# checked like anything else and this stays one reviewable line rather than a
# blanket switch-off. Everything else in the tree is still checked.
#
# Both versions belong to ONE entry joined by `||`. The matcher returns on the
# first rule whose NAME matches and hands back only that rule's version list, so
# a second `semver@...` line below is dead -- listing them separately excludes
# 5.7.2 and lets 6.3.1 fail, which is exactly how this first went wrong.
# The @typescript-eslint family is the same shape, checked package by package:
# 5.62.0 is the last stable 5.x of each (2023-07-10), NOT ONE 5.x release of any
# of them is attested, and the first attested version of each is 8.42.0, from
# 2025-09-02. So the comparison is a 2025 release against a 2023 one across the
# whole package, and there is no attested version on the line to move to.
#
# @stripe/ui-extension-tools pins them, so the alternative is a major bump inside
# somebody else's dependency. Until that lands, no dependency anywhere in this
# workspace can be added: the resolver reaches services/stripe-app on every
# install that is not served entirely from the lockfile.
#
# One entry per package NAME, per the matcher note above.
trustPolicyExclude:
    - semver@5.7.2 || 6.3.1
    - '@typescript-eslint/eslint-plugin@5.62.0'
    - '@typescript-eslint/parser@5.62.0'
    - '@typescript-eslint/scope-manager@5.62.0'
    - '@typescript-eslint/type-utils@5.62.0'
    - '@typescript-eslint/types@5.62.0'
    - '@typescript-eslint/typescript-estree@5.62.0'
    - '@typescript-eslint/utils@5.62.0'
    - '@typescript-eslint/visitor-keys@5.62.0'

