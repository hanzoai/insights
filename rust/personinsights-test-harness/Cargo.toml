[package]
name = "personinsights-test-harness"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
personinsights-common = { path = "../personinsights-common" }
personinsights-proto = { path = "../personinsights-proto" }
common-metrics = { path = "../common/metrics" }
personinsights-coordination = { path = "../personinsights-coordination" }
assignment-coordination = { path = "../common/assignment-coordination" }

anyhow = { workspace = true }
axum = { workspace = true }
metrics = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true, features = ["derive", "env"] }
futures = { workspace = true }
hdrhistogram = { workspace = true }
humantime = { workspace = true }
k8s-openapi = { version = "0.24", features = ["latest"] }
kube = { version = "0.98", features = ["client"] }
rand = { workspace = true }
rdkafka = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }

[lints]
workspace = true
